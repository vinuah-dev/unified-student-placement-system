<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black-box test run</title>
<style>
  body { margin: 16px; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; color: #1d2433; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  #summary { margin: 0 0 12px; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #d6dbe4; padding: 4px 6px; text-align: left; vertical-align: top; }
  th { background: #eef1f6; }
  td.PASS { color: #17663a; font-weight: 700; }
  td.FAIL { color: #a32020; font-weight: 700; }
  iframe { width: 1000px; height: 760px; border: 1px solid #d6dbe4; margin-top: 16px; }
</style>
</head>
<body>
<h1>Expt-8 · Black-box test run · Online Leave Management System</h1>
<p id="summary">Running…</p>
<table>
  <thead><tr><th>TC ID</th><th>Form</th><th>Scenario</th><th>Expected output</th><th>Actual output</th><th>Status</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<iframe id="frame" title="Page under test"></iframe>
<pre id="results-json" hidden></pre>
<script src="testcases.js"></script>
<script src="harness.js"></script>
<script>
(async function () {
  const frame = document.getElementById("frame");
  const rows = document.getElementById("rows");
  const results = [];

  for (const tc of TEST_CASES) {
    const r = await executeCase(frame, tc);
    results.push(r);
    const tr = document.createElement("tr");
    [r.id, r.form, r.scenario, r.expected, r.actual, r.status].forEach(function (v, i) {
      const td = document.createElement("td");
      td.textContent = v;
      if (i === 5) td.className = v;
      tr.appendChild(td);
    });
    rows.appendChild(tr);
  }

  const passed = results.filter(function (r) { return r.status === "PASS"; }).length;
  const executedAt = new Date().toString();
  document.getElementById("summary").textContent =
    results.length + " test cases executed · " + passed + " passed · " + (results.length - passed) +
    " failed · " + executedAt;
  document.getElementById("results-json").textContent = JSON.stringify({
    executedAt: executedAt, today: shiftedDate(0), userAgent: navigator.userAgent, results: results
  });
  frame.remove();
  document.title = "DONE";
})();
</script>
</body>
</html>
