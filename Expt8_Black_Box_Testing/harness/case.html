<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expt-8 black box test case</title>
<style>
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", Arial, sans-serif; }
  #bar { min-height: 34px; padding: 6px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px;
         background: #26303f; color: #fff; font-size: 13px; box-sizing: border-box; }
  #bar b.PASS { color: #7fe0a0; }
  #bar b.FAIL { color: #ff9a9a; }
  iframe { display: block; width: 100%; height: calc(100% - 46px); border: 0; }
</style>
</head>
<body>
<div id="bar">Running…</div>
<iframe id="frame" title="USPS page under test"></iframe>
<pre id="result" hidden></pre>
<script src="harness.js"></script>
<script src="testcases.js"></script>
<script>
// Usage: case.html?tc=TC_PJ_01[&scroll=elementId]
// Opens the USPS page as the case's user, enters the test data through the form, presses the button and
// records what the page displays. The server is started with the pre-loaded data for every test case.
(async function () {
  const params = new URLSearchParams(location.search);
  const tc = TEST_CASES.find((c) => c.id === params.get("tc"));
  const frame = document.getElementById("frame");
  let actual;
  try {
    const doc = await openPage(frame, tc);
    actual = await tc.run(doc, frame.contentWindow);
    if (params.get("scroll")) doc.getElementById(params.get("scroll")).scrollIntoView({ block: "start" });
  } catch (e) {
    actual = "ERROR: " + e.message;
  }
  const status = actual === tc.expected ? "PASS" : "FAIL";
  const bar = document.getElementById("bar");
  bar.innerHTML = "";
  [["Test case", tc.id], ["Executed", new Date().toLocaleString("en-IN")], ["Actual output", actual],
   ["Status", status]].forEach((p) => {
    const span = document.createElement("span");
    span.textContent = p[0] + ": ";
    const b = document.createElement("b");
    b.textContent = p[1];
    if (p[0] === "Status") b.className = status;
    span.appendChild(b);
    bar.appendChild(span);
  });
  document.getElementById("result").textContent = JSON.stringify({
    id: tc.id, form: tc.form, technique: tc.technique, scenario: tc.scenario, user: tc.user, inputs: tc.inputs,
    expected: tc.expected, actual: actual, status: status, userAgent: navigator.userAgent
  });
  document.title = "DONE";
})();
</script>
</body>
</html>
