<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI test case evidence</title>
<style>
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", Arial, sans-serif; }
  #bar { height: 34px; padding: 0 14px; display: flex; align-items: center; gap: 18px; background: #26303f; color: #fff; font-size: 13px; }
  #bar b.PASS { color: #7fe0a0; }
  #bar b.FAIL { color: #ff9a9a; }
  iframe { display: block; width: 100%; height: calc(100% - 34px); border: 0; }
</style>
</head>
<body>
<div id="bar">Loading…</div>
<iframe id="frame" title="Dashboard under test"></iframe>
<script>
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
async function waitFor(cond, timeout = 5000) {
  const start = Date.now();
  while (Date.now() - start < timeout) {
    try { if (cond()) return; } catch (e) { /* page still loading */ }
    await sleep(50);
  }
  throw new Error("timed out waiting for the page");
}
</script>
<script src="ui_cases.js"></script>
<script>
// Usage: show.html?tc=TC_UI_14[&scroll=elementId] - runs one UI case and leaves the dashboard in that state.
(async function () {
  const params = new URLSearchParams(location.search);
  const tc = UI_CASES.find((c) => c.id === params.get("tc"));
  const frame = document.getElementById("frame");
  const bar = document.getElementById("bar");
  await new Promise((resolve) => { frame.onload = resolve; frame.src = "/?evidence=" + Date.now(); });
  const doc = frame.contentDocument;
  await waitFor(() => doc.querySelectorAll("#roomTabs button").length > 0 && doc.getElementById("setFrames").value !== "");
  const actual = await tc.run(doc);
  const status = actual === tc.expected ? "PASS" : "FAIL";
  if (params.get("scroll")) doc.getElementById(params.get("scroll")).scrollIntoView({ block: "start" });
  bar.innerHTML = "";
  [["Test case", tc.id], ["Executed", new Date().toLocaleString("en-IN")], ["Actual", actual], ["Status", status]].forEach((p) => {
    const span = document.createElement("span");
    span.textContent = p[0] + ": ";
    const b = document.createElement("b");
    b.textContent = p[1];
    if (p[0] === "Status") b.className = status;
    span.appendChild(b);
    bar.appendChild(span);
  });
  document.title = "DONE";
})();
</script>
</body>
</html>
